<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540"><rect width="1100" height="540" fill="#101216"/><text x="48" y="58" fill="#dde1e7" font-size="26" font-weight="800" letter-spacing="-0.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Glassbook</text><text x="48" y="80" fill="#7d848e" font-size="12" letter-spacing="2" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">МАРШРУТ ОДНОЙ ЗАЯВКИ</text><line x1="90" y1="190" x2="960" y2="190" stroke="#5fa89f" stroke-width="7" stroke-linecap="round"/><polyline points="610,190 610,320 970,320" fill="none" stroke="#8e9ac0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="430" y1="95" x2="430" y2="190" stroke="#565c66" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/><polyline points="260,190 260,330 260,440" fill="none" stroke="#565c66" stroke-width="5" stroke-linecap="round"/><circle cx="90" cy="190" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="90" y="154" text-anchor="middle" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Браузер</text><text x="90" y="172" text-anchor="middle" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">вы нажимаете «Купить»</text><circle cx="260" cy="190" r="11" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="260" y="154" text-anchor="middle" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">API</text><text x="260" y="172" text-anchor="middle" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">REST + проверка пропуска (JWT)</text><circle cx="430" cy="190" r="11" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="430" y="230" text-anchor="middle" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Очередь</text><text x="430" y="248" text-anchor="middle" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">все команды — строго по порядку</text><circle cx="610" cy="190" r="11" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="610" y="154" text-anchor="middle" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Движок</text><text x="610" y="172" text-anchor="middle" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">сводит заявки в одном потоке</text><circle cx="780" cy="190" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="780" y="154" text-anchor="middle" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Рассылка</text><text x="780" y="172" text-anchor="middle" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">стакан, сделки, свечи</text><circle cx="960" cy="190" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="960" y="154" text-anchor="middle" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Браузер</text><text x="960" y="172" text-anchor="middle" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">обновляется сам (WebSocket)</text><circle cx="430" cy="95" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="450" y="92" text-anchor="start" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Боты</text><text x="450" y="110" text-anchor="start" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">12 «трейдеров» внутри сервера</text><circle cx="610" cy="320" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="610" y="356" text-anchor="middle" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Журнал на диске</text><text x="610" y="374" text-anchor="middle" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">запись до ответа (fsync)</text><circle cx="790" cy="320" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="790" y="356" text-anchor="middle" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">PostgreSQL</text><text x="790" y="374" text-anchor="middle" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">заявки, сделки, счета</text><circle cx="970" cy="320" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="970" y="356" text-anchor="middle" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Kafka</text><text x="970" y="374" text-anchor="middle" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">поток сделок</text><circle cx="260" cy="330" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="280" y="327" text-anchor="start" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Prometheus</text><text x="280" y="345" text-anchor="start" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">собирает метрики</text><circle cx="260" cy="440" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="280" y="437" text-anchor="start" fill="#dde1e7" font-size="15" font-weight="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Grafana</text><text x="280" y="455" text-anchor="start" fill="#7d848e" font-size="11.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">графики работы</text><line x1="48" y1="505" x2="78" y2="505" stroke="#5fa89f" stroke-width="5" stroke-linecap="round"/><text x="90" y="509" fill="#7d848e" font-size="12" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">основной путь</text><line x1="250" y1="505" x2="280" y2="505" stroke="#8e9ac0" stroke-width="5" stroke-linecap="round"/><text x="292" y="509" fill="#7d848e" font-size="12" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">сохранение данных</text><line x1="470" y1="505" x2="500" y2="505" stroke="#565c66" stroke-width="5" stroke-linecap="round"/><text x="512" y="509" fill="#7d848e" font-size="12" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">подсобные линии: боты и мониторинг</text><circle cx="860" cy="505" r="8" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="878" y="509" fill="#7d848e" font-size="12" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">станция</text><circle cx="960" cy="505" r="11" fill="#101216" stroke="#c9cfd8" stroke-width="3.5"/><text x="982" y="509" fill="#7d848e" font-size="12" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">узел</text></svg>