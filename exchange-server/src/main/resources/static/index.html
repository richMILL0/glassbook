<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glassbook</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>Glassbook</div>
  <nav id="symbols"></nav>
  <div id="ticker"></div>
  <div class="spacer"></div>
  <div id="auth"></div>
</header>
<main>
  <section class="panel" id="chart-panel">
    <h2>Price <span class="muted" id="candle-note">5s candles</span></h2>
    <canvas id="chart"></canvas>
  </section>
  <section class="panel" id="book-panel">
    <h2>Order book <span class="muted" id="spread"></span></h2>
    <div class="book-head"><span>Price</span><span>Qty</span><span>Total</span></div>
    <div id="asks"></div>
    <div id="mid"></div>
    <div id="bids"></div>
  </section>
  <section class="panel" id="tape-panel">
    <h2>Trades</h2>
    <div class="tape-head"><span>Price</span><span>Qty</span><span>Time</span></div>
    <div id="tape"></div>
  </section>
  <section class="panel" id="order-panel">
    <h2>Place order</h2>
    <form id="order-form">
      <div class="seg" id="side"><button type="button" data-v="BUY" class="on buy">Buy</button><button type="button" data-v="SELL" class="sell">Sell</button></div>
      <div class="seg" id="type"><button type="button" data-v="LIMIT" class="on">Limit</button><button type="button" data-v="MARKET">Market</button></div>
      <label>Price <input id="price" type="number" step="0.01" min="0"></label>
      <label>Quantity <input id="qty" type="number" step="1" min="1" value="10"></label>
      <label>Time in force
        <select id="tif"><option>GTC</option><option>IOC</option><option>FOK</option><option>POST_ONLY</option></select>
      </label>
      <button class="submit" id="submit" type="submit">Buy</button>
      <div id="order-msg" class="msg"></div>
    </form>
    <div id="account"></div>
  </section>
  <section class="panel" id="orders-panel">
    <h2>My orders</h2>
    <div id="orders"></div>
  </section>
</main>
<dialog id="login">
  <form method="dialog" id="login-form">
    <h3>Sign in</h3>
    <input id="u" placeholder="username" autocomplete="username" required>
    <input id="p" type="password" placeholder="password (min 8)" autocomplete="current-password" required>
    <div class="msg" id="login-msg"></div>
    <div class="row"><button value="login" id="do-login">Sign in</button><button value="register" id="do-register">Create account</button><button value="cancel" formnovalidate>Close</button></div>
    <p class="muted">A new account gets demo cash and shares.</p>
  </form>
</dialog>
<script src="/app.js"></script>
</body>
</html>
